name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile host/chrome_codex_switcher/*.py
      - name: Tests
        env:
          PYTHONPATH: host
          CCS_DISABLE_CLIPBOARD_WATCH: '1'
        run: python -m unittest discover -s tests -v
      - name: Validate extension JSON
        run: python -m json.tool extension/manifest.json >/dev/null
      - name: Validate Chrome extension JavaScript
        run: node --check extension/background.js && node --check extension/content.js && node --check extension/sidepanel.js
      - name: Validate GNOME companion JavaScript
        run: node --check contrib/gnome-extension@gernalix.github.com/extension.js
      - name: Validate GNOME settings schema
        run: glib-compile-schemas --strict --dry-run contrib/gnome-extension@gernalix.github.com/schemas
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh contrib/install-gnome-overlay.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chrome for Testing and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true
      - name: Install Selenium
        run: python -m pip install 'selenium>=4.30,<5'
      - name: Full note persistence E2E
        env:
          PYTHONPATH: host
          CCS_DISABLE_CLIPBOARD_WATCH: '1'
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: xvfb-run -a python tests/e2e/test_note_state_persistence.py
