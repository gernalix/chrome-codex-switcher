name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile host/chrome_codex_switcher/*.py
      - name: Tests
        env:
          PYTHONPATH: host
          CCS_DISABLE_CLIPBOARD_WATCH: '1'
        run: python -m unittest discover -s tests -v
      - name: Validate extension JSON
        run: python -m json.tool extension/manifest.json >/dev/null
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh
