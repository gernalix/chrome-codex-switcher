<!doctype html>
<html lang="it">
<meta charset="utf-8">
<title>Nota privata CCS</title>
<style>
  * { box-sizing: border-box; }
  html,body { height:100%; margin:0; background:#101114; color:#f4f4f4; }
  body { display:flex; flex-direction:column; font:13px/1.4 system-ui,sans-serif; }
  textarea { display:block; flex:1; min-height:0; width:100%; resize:none; padding:5px; font:inherit;
    color:inherit; background:transparent; border:0; outline:none; }
  textarea:focus { box-shadow: inset 0 0 0 1px #777b87; }
  #status { margin:0; padding:0 5px; font-size:11px; color:#e4c887; }
  #status:empty { display:none; }
</style>
<textarea id="note" aria-label="Nota Chrome" disabled></textarea>
<p id="status" role="status"></p>
<script src="inline-note.js"></script>
</html>
