schema_version: c2.project-capsule.v1
identity:
  project_id: 99
  slug: chrome-codex-switcher
  repository_id: R0100
scope:
  purpose: Pair explicit Chrome tab contexts with native Codex thread deep links while
    preserving scoped notes and identity bindings.
  boundaries:
  - Never focus real windows, synthesize keystrokes or read the live clipboard for
    source verification.
  - Historical prompt cards do not authorize restarting retired C2/C3 control planes.
  - Browser-extension persistence E2E in CI is distinct from live GNOME/Wayland acceptance.
repository:
  canonical_workdir: /home/daniele/projects/chrome-codex-switcher
  branch_policy: Use isolated task worktrees and the installed single writer; protect
    the current primary branch and preserve all valid work.
architecture:
  summary: store.py owns SQLite note/context persistence; context_bindings.py and
    clipboard_binding.py isolate binding policies. broker.py and daemon.py route bounded
    local events; extension/ owns Chrome surfaces, while the GNOME companion owns
    compositor clipboard/focus events without desktop overlays. verifier and identity
    watchers fail closed on ambiguous active threads.
  entrypoints:
  - host/chrome_codex_switcher/cli.py
  - host/chrome_codex_switcher/daemon.py
  important_paths:
  - host/chrome_codex_switcher
  - extension
  - contrib
  - systemd
  - tests
  - README.md
dependencies:
- name: Python standard library and system SQLite
  purpose: Offline policy, data and fixture verification.
- name: Bubblewrap
  purpose: Read-only source with private temporary home/runtime/data, isolated processes
    and network.
- name: Node and GNOME/Chrome integration
  purpose: Actor-free JavaScript fixture verification locally; real desktop integration
    is separately accepted.
data:
  schema: Private state.sqlite3 retains contexts, note/layout state, pairings and
    indexed metadata; overlay.json is derived cache. Native Codex threads and browser
    sessions are not duplicated authorities. Explicit historical prompt bindings are
    metadata, not inferred lifecycle identities.
  migrations: Use the owning Store schema/migrations with consistent backup; preserve
    notes, pairings, separate Chrome/Codex note values and established IDs. Source
    validation does not migrate the live desktop store.
runtime:
  services:
  - chrome-codex-switcher.service
  timers: []
  containers: []
devices: []
commands:
  setup:
    not_applicable: Use existing global runtime/test dependencies; no venv, live data
      ingestion or host provisioning is part of verification.
  build:
    not_applicable: Python source has no required compiled build.
